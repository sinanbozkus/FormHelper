# Attaches the scripts and styles to a GitHub release, for projects that don't use the NuGet package's embedded files.
name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Zip and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          name="formhelper-${TAG#v}"
          mkdir -p "$name"
          cp src/FormHelper/Scripts/* src/FormHelper/Styles/* License.txt "$name"/
          zip -r "$name.zip" "$name"
          gh release upload "$TAG" "$name.zip" --clobber
